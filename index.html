<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shield-Up</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="w">
    <header class="top">
      <h1>🛡️ Shield-Up</h1>
      <a class="contributors-link" href="contributors.html">Contributors</a>
      <span id="lvl" class="badge">Threat: Unknown</span>
    </header>
    <section class="g card" aria-label="Security overview">
      <div>
        <div class="metric-label">SECURITY SCORE</div>
        <div class="big" id="sc">50</div>
      </div>
      <div>
        <div class="metric-label">INCIDENT STATUS</div>
        <div class="big status-value" id="st">Investigating</div>
      </div>
    </section>
    <nav class="tabs" id="tabs" aria-label="Incident response steps"></nav>
    <main id="main"></main>
    <section class="card" aria-labelledby="score-heading">
      <h2 id="score-heading">📈 Score Over Time</h2>
      <div id="gr"></div>
    </section>
    <section class="card" aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">📜 Incident Timeline</h2>
      <div id="log"></div>
    </section>
  </div>
  <script src="index.js"></script>
</body>
</html>
